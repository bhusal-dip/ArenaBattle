# fly.toml app configuration file generated for console-cloud on 2026-08-16T10:06:49Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'console-cloud'
primary_region = 'bom'

[build]

# This is the actual fix for the wrong join-link problem: it forces the QR
# code / join URL to always use your real public Fly.io URL instead of
# guessing from the incoming request, which isn't reliable behind Fly's proxy.

[env]
  PUBLIC_BASE_URL = "https://console-cloud.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
